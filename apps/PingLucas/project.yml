# XcodeGen spec. The .xcodeproj is generated, never committed -- which is what
# lets this app be developed and built without a Mac in the loop.
#   brew install xcodegen && xcodegen generate
name: PingLucas
options:
  bundleIdPrefix: com.lucaspirola.pinglucas
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Free Apple ID signing is configured locally; CI builds unsigned.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  PingLucas:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: Shared
    dependencies:
      - target: PingLucas Watch App
        embed: true
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: PingLucas
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucaspirola.pinglucas
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  PingLucas Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Watch/Sources
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: PingLucas
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.lucaspirola.pinglucas
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucaspirola.pinglucas.watchkitapp

schemes:
  PingLucas:
    build:
      targets: { PingLucas: all }
    run: { config: Debug }
    archive: { config: Release }
  PingLucas Watch App:
    build:
      targets: { PingLucas Watch App: all }
    run: { config: Debug }
    archive: { config: Release }
